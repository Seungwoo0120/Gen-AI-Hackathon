interactions:
  - id: warfarin-aspirin
    ingredients: [warfarin, aspirin]
    severity: major
    summary:
      en: "Taking warfarin with aspirin can increase bleeding risk. Check with a doctor or pharmacist before using them together."
    sources:
      - title: "DailyMed: Warfarin Sodium Tablets, USP — NSAIDs including aspirin"
        url: https://dailymed.nlm.nih.gov/dailymed/fda/fdaDrugXsl.cfm?setid=36a919ce-7a21-40c0-9af5-2299bf2b1f97
    reviewed: false

  - id: warfarin-ibuprofen
    ingredients: [warfarin, ibuprofen]
    severity: major
    summary:
      en: "Taking warfarin with ibuprofen can increase the risk of serious bleeding. Check with a doctor or pharmacist before using them together."
    sources:
      - title: "FDA label: CALDOLOR (ibuprofen) — drugs that interfere with hemostasis"
        url: https://www.accessdata.fda.gov/drugsatfda_docs/label/2023/022348s024lbl.pdf
    reviewed: false

  - id: aspirin-ibuprofen
    ingredients: [aspirin, ibuprofen]
    severity: moderate
    summary:
      en: "Ibuprofen can reduce low-dose aspirin's antiplatelet effect and can increase gastrointestinal side effects. Check with a doctor or pharmacist before using them together."
    sources:
      - title: "FDA: Information about taking ibuprofen and aspirin together"
        url: https://www.fda.gov/drugs/safe-use-aspirin/information-about-taking-ibuprofen-and-aspirin-together
    reviewed: false

  - id: amlodipine-simvastatin
    ingredients: [amlodipine, simvastatin]
    severity: moderate
    summary:
      en: "Amlodipine increases exposure to simvastatin, so a simvastatin dose limit may apply. Check with a doctor or pharmacist about this combination."
    sources:
      - title: "DailyMed: Amlodipine besylate — impact on simvastatin"
        url: https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=c411a30f-51be-490d-9bc3-d5cbe1357c3c
    reviewed: false

  - id: simvastatin-clarithromycin
    ingredients: [simvastatin, clarithromycin]
    severity: major
    summary:
      en: "Clarithromycin can greatly raise simvastatin levels and the risk of serious muscle injury. Check with a doctor or pharmacist before using them together."
    sources:
      - title: "DailyMed: Clarithromycin — HMG-CoA reductase inhibitors"
        url: https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=2b5aef5f-d96e-55e0-e054-00144ff8d46c
    reviewed: false

  - id: ibuprofen-lisinopril
    ingredients: [ibuprofen, lisinopril]
    severity: moderate
    summary:
      en: "Ibuprofen can reduce the blood-pressure-lowering effect of lisinopril and may worsen kidney function in some people. Check with a doctor or pharmacist about this combination."
    sources:
      - title: "FDA label: CALDOLOR (ibuprofen) — ACE inhibitors and renal function"
        url: https://www.accessdata.fda.gov/drugsatfda_docs/label/2023/022348s024lbl.pdf
    reviewed: false

  - id: ibuprofen-losartan
    ingredients: [ibuprofen, losartan]
    severity: moderate
    summary:
      en: "Ibuprofen can reduce the blood-pressure-lowering effect of losartan and may worsen kidney function in some people. Check with a doctor or pharmacist about this combination."
    sources:
      - title: "DailyMed: Losartan potassium — non-steroidal anti-inflammatory agents"
        url: https://dailymed.nlm.nih.gov/dailymed/getFile.cfm?setid=4c6fca7d-9e36-4455-9e37-7ed2d64f64b2&type=pdf
    reviewed: false

  - id: sildenafil-glyceryl-trinitrate
    ingredients: [sildenafil, glyceryl trinitrate]
    severity: major
    summary:
      en: "Sildenafil with nitrate medicines can cause an unsafe fall in blood pressure. Check with a doctor or pharmacist before using them together."
    sources:
      - title: "DailyMed: Sildenafil citrate — nitrates contraindication"
        url: https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=98a9897b-0cbc-4ea6-9ac2-4dd719a2ede0
    reviewed: false

duplicateRisks:
  - id: duplicate-paracetamol
    ingredient: paracetamol
    severity: major
    summary:
      en: "These products both contain paracetamol, which can lead to an accidental overdose and serious liver damage. Check with a doctor or pharmacist before using them together."
    sources:
      - title: "FDA: Acetaminophen — avoid more than one acetaminophen-containing product"
        url: https://www.fda.gov/drugs/safe-use-over-counter-pain-relievers-and-fever-reducers/acetaminophen
    reviewed: false
